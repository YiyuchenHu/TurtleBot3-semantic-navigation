# Host-specific compose overlay (committed on purpose — this is a
# single-machine project; adjust the marked paths on any other host).
# Every compose command needs both files, in this order:
#
#   docker compose -f docker/compose.yaml -f docker/compose.local.yaml <cmd>

services:
  sim:
    environment:
      # X11 cookie for the host display, mounted below.
      - XAUTHORITY=/tmp/.host_xauth
    volumes:
      # ── HOST-SPECIFIC ── X11 auth cookie. This host runs a GDM Xorg
      # session, whose cookie lives under /run/user/<uid>/gdm/Xauthority.
      # If $XAUTHORITY is unset in the invoking shell, the fallback below
      # must match `echo $XAUTHORITY` from a desktop terminal. (On hosts
      # using ~/.Xauthority, point it there instead.)
      - ${XAUTHORITY:-/run/user/1000/gdm/Xauthority}:/tmp/.host_xauth:ro
      # ── HOST-SPECIFIC ── The NVIDIA Container Toolkit on this host
      # injects the driver libraries but NOT the glvnd EGL vendor
      # descriptor, so glvnd silently falls back to Mesa llvmpipe (August
      # stack, stage4_5_stack_verification.md §3.2). Bind-mounting the
      # host's 107-byte ICD JSON read-only keeps hardware GL across
      # container recreation. Path is the stock Ubuntu driver location.
      - /usr/share/glvnd/egl_vendor.d/10_nvidia.json:/usr/share/glvnd/egl_vendor.d/10_nvidia.json:ro
