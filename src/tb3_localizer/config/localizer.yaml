# ============================================================
# tb3_localizer — localizer_node configuration
# ============================================================
# Stage-2 planar localizer: fuse 2D detections + LiDAR → (x,y) in base_link.
#
# See semantic_targets.yaml for the canonical name mapping
# (semantic_name ↔ detector_label ↔ gazebo_model).

localizer_node:
  ros__parameters:
    # ── Camera ────────────────────────────────────────────
    # Horizontal field of view (degrees).  Default Gazebo TurtleBot3 camera
    # uses a <horizontal_fov> of 1.085595 rad ≈ 62.2°.
    # Verify: ros2 topic echo /camera/camera_info --once | grep width
    camera_hfov_deg: 62.2

    # ── LiDAR fusion ──────────────────────────────────────
    # Number of scan rays on EACH SIDE of the central bearing ray.
    # Total window = 2 * scan_window_half + 1 rays.
    # Larger = more robust to noise, but blurs separate nearby objects.
    scan_window_half: 10             # widened from 5 for bench (wide bbox ~32deg)

    # Valid range bounds (metres). Reject inf/nan and returns outside this band.
    min_valid_range: 0.12
    max_valid_range: 5.0             # tightened from 8.0 for 4x6m warehouse

    # ── Frame-edge boxes ──────────────────────────────────
    # Drop detections whose bbox centre is within this many pixels of the
    # left or right image edge (640 px wide: u < 40 or u > 600). A box
    # clipped by the frame has its centre pulled inward, so its bearing
    # points beside the object and the LiDAR window returns whatever stands
    # there. Measured 2026-09-03 over 12 runs: 10-13% of all boxes per class
    # sat at the edge, and those were the source of the trash_can points on
    # the person that grew cross-class candidates to n=8-10. The node logs
    # "[edge_drop] dropped/seen per class" every edge_drop_summary_sec.
    edge_margin_px: 40
    edge_drop_summary_sec: 30.0

    # ── bbox height ↔ ray distance consistency gate ───────
    # The scan ray is cast at the bbox centre column; when a FAR object's
    # column crosses a NEARER obstacle, the ray returns the near range and
    # the observation lands on the wrong object. A real object
    # at ray distance d subtends ≈ f·H/d px — a bbox shorter than
    # expected/tolerance belongs to something farther than the ray hit
    # and is dropped. One-sided on purpose: taller-than-expected boxes
    # are frame-clipping at close range and stay accepted. A mapping
    # test run (pre-gate) had three "person wearing a blue shirt" ghosts and a
    # cone ghost at n=8 each, all far-box-on-near-obstacle; the
    # occlusion filter only fires when the occluder is detected in the
    # SAME frame.
    height_gate_enabled: true
    # Reject when apparent depth ratio exceeds this (bbox_h < expected/tol).
    height_gate_tolerance: 2.0
    # "label:metres[:tolerance]" (true model heights — MEASURE, don't
    # assume: construction_cone carries <scale>10 10 10</scale> and is
    # ~0.9 m in this world, not a real cone's 0.35 m; the wrong prior
    # made a test run's upper check kill all 86 TRUE cone observations).
    # Any label containing "person" (color expressions, injected search
    # terms) falls back to the "person" prior; labels without a prior
    # are not gated.
    # Squat classes (<= 0.8 m) get tighter per-class tolerances AND a
    # two-sided check (much-taller-than-expected box = a bigger object
    # force-matched into the class): with the default 2.0 a test-run
    # cone ghost slipped through at 88 px vs 84 px required (1.1 m ray).
    # traffic cone at 0.9 m keeps its tight 1.4 tolerance but sits above
    # the 0.8 m squat threshold, so it is one-sided again — its ghosts
    # were far-box-on-near-obstacle, which the lower bound still kills.
    height_priors: ["person:1.75", "bookshelf:1.2:1.5", "trash can:0.6:1.5",
                    "traffic cone:0.9:1.4", "concrete barrier:1.1"]

    # ── Scan ↔ image stamp matching ───────────────────────
    # The detections carry the SOURCE IMAGE stamp; the ray must be cast
    # into the scan taken at that time, not into whatever scan arrived
    # last when the detections came back from the grounding server
    # (~0.35-0.5 s later — ~10° of yaw at 0.4 rad/s). Audit on a 61 s
    # turning bag, 94 turning boxes: on-object 69% → 81% with matching.
    # Scans are buffered (scan_buffer_len ≈ 5 s at 5 Hz) and the nearest
    # header stamp wins; if it is further than scan_match_max_dt_sec from
    # the image stamp (unsynchronised clocks) the latest scan is used and
    # the fallback is counted in the periodic [scan_match] log line.
    scan_stamp_matching: true
    scan_match_max_dt_sec: 0.25
    scan_buffer_len: 25

    # ── Topics ────────────────────────────────────────────
    detections_topic: "/detector_node/detections"
    scan_topic:       "/scan"
    image_topic:      "/camera/image_raw"
    output_topic:     "~/object_points"    # → /localizer_node/object_points

    # ── Output ────────────────────────────────────────────
    # Frame for published PointStamped messages.
    # Use "base_link" for Stage-2 MVP (robot-relative).
    # Future: transform to "map" via TF inside the node or downstream.
    output_frame: "base_link"
