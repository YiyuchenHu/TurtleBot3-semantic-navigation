# Bind-mounted to ~/.gazebo/gui.ini in the sim container (compose.yaml)
# so the gzclient window geometry used for demo recording survives
# container recreation. The [camera] pose is written here for the record
# but Gazebo Classic 11 does NOT apply it at startup (verified in R02a);
# the top-down view is still set by hand in the GUI before recording.
# gzclient rewrites this file on exit — a dirty git diff here just means
# the window was moved; commit or checkout as appropriate.
[geometry]
x=50
y=90
width=2960
height=1800

[camera]
pose = 0.0 -1.2 10.5 0 1.35 1.5708
