# ============================================================
# tb3_detector — la_detector_node configuration
# ============================================================
# LocateAnything mapping-path detector (Phase 2b). Drop-in producer for
# /detector_node/detections: same message contract as the YOLO
# detector_node, but inference happens over HTTP in the grounding
# container (POST /detect, fixed vocabulary).

la_detector_node:
  ros__parameters:
    # ── Grounding server ───────────────────────────────────
    # The grounding compose service shares the sim container's network
    # namespace, so loopback resolves from every in-container node.
    server_url: "http://127.0.0.1:8801"
    request_timeout_sec: 5.0

    # ── Vocabulary ─────────────────────────────────────────
    # DEFAULT = MAP-AND-SEARCH (R05): the five registry classes map
    # during exploration, so a repeated command ("go to the bookshelf")
    # is answered from memory; color-attribute person queries and
    # anything else outside the registry go through the search link
    # (injection unchanged — R04 acceptance path).
    #
    # The shirt-color expressions were TRIED as vocabulary entries
    # (publish colored persons under their expressions, R05 step 3
    # first attempt) and demoted back to coverage after two failed
    # mapping smokes. Measured failure modes, ~10 min exploration each:
    #   * far-box mislocalization: a distant person's expression box
    #     whose centre column crossed a nearer object planted
    #     "person wearing a blue shirt" landmarks on the red person,
    #     the trash can and a white person (n=8 each). The R05 height
    #     gate in the localizer now kills these (92 blue drops in
    #     smoke 2) — but not the second mode:
    #   * color-collision force-matches ON the object: the ORANGE cone
    #     label force-matched the RED-shirt person, the GREEN trash can
    #     label the GREEN-shirt person, and blue beat "person" for
    #     white persons via dedup priority (token-subset boxes agree,
    #     the more specific label won). These boxes sit on the target
    #     itself at the right size, so no geometric filter can reject
    #     them.
    # As coverage the expressions VETO exactly those force-matches
    # (the red person's "person wearing a red shirt" coverage box
    # disagrees with a "traffic cone" box on the same object) — the
    # R02c/R04-proven mechanism. Colored persons map as plain "person"
    # (their expression coverage box is a token-subset agreement).
    #
    # Other profiles (detector_config launch argument, runbook §7):
    #   * la_detector_search_first.yaml — the R04 demo shape: empty
    #     vocabulary, nothing maps, every command searches.
    #   * la_detector_four_class.yaml — pre-R04 default, 4 world
    #     classes only.
    #   * la_detector_person_only.yaml — R02c acceptance profile.
    vocabulary: ["person", "bookshelf", "trash can", "traffic cone",
                 "concrete barrier"]

    # ── Search-link injection ──────────────────────────────
    # Latched String from the coordinator: a free-form expression to
    # detect IN ADDITION to the base vocabulary ('' = none).
    active_search_topic: "/active_search"

    # ── Coverage categories (requested, filtered on, NEVER published) ──
    # R02c smoke run 1 measured what shrinking the vocabulary does: with
    # ["person"] alone the occlusion filter went blind to the three
    # world objects, a mislocalized box chain promoted a fake person at
    # the trash can and at the bookshelf, and the cone collected enough
    # forced-choice "trash can" boxes (n=5) that the search navigated
    # to the wrong object. These categories ride along in every /detect
    # request so the geometric safety nets (occlusion filter, same-
    # object veto) see those objects again — but their boxes are
    # dropped before publishing, so the classes never reach memory
    # until a search injects them. Set [] to disable (pure open-world).
    # The node subtracts anything already in the effective vocabulary
    # (including the active search term — a searched class must not
    # veto itself).
    #
    # With the R05 vocabulary the effective coverage is the four
    # shirt-color expressions. They carry two jobs:
    #   * color-collision protection (R05): the cone label force-
    #     matches the red-shirt person and the trash-can label the
    #     green-shirt person (matching colors); the person's own
    #     expression coverage box disagrees with those boxes and
    #     vetoes them. Without this, ~10 min of exploration promoted
    #     a "traffic cone" landmark ON the red person and a
    #     "trash can" landmark ON the green person.
    #   * correct-alternative set for color searches (R04 probe:
    #     negatives 0/6 without the full color set, 12/12 with it —
    #     reports/R04_probe/).
    # The physical classes stay listed for profile-switching safety:
    # the node subtracts anything already in the effective vocabulary,
    # so they are harmless here and become real coverage again under a
    # smaller-vocabulary profile.
    coverage_categories: ["person", "bookshelf", "trash can", "traffic cone",
                          "concrete barrier",
                          "person wearing a green shirt",
                          "person wearing a red shirt",
                          "person wearing a blue shirt",
                          "person wearing a white shirt"]

    # ── Sampling ───────────────────────────────────────────
    # Server-side detect is ~0.2-0.3 s/frame (R01 §5.7); 0.3 s keeps at
    # most ~3 requests/s and matches the YOLO node's effective rate.
    min_interval_sec: 0.3
    # Skip frames while the robot spins faster than this (rad/s, from
    # /odom): motion blur plus the localizer's latest-scan bearing match
    # make fast-rotation detections land on the wrong obstacle.
    max_angular_vel: 0.5

    # ── Bearing-occlusion filter ───────────────────────────
    # Drop a detection whose bbox centre column is spanned by a NEARER
    # detection of another class (nearer = bottom edge >=8 px lower;
    # everything here stands on the floor). The planar localizer casts
    # the scan ray at the centre column, so such detections are
    # guaranteed to be localized onto the occluder — run 1 measured the
    # cone behind the centre person planting a fake "traffic cone"
    # landmark on the person this way (R02b §4).
    occlusion_filter: true

    # ── Cross-class dedup ──────────────────────────────────
    # The model can list one physical object under several vocabulary
    # entries (R01 §2.3: armchair/chair cross-listing). Two boxes of
    # DIFFERENT labels with IoU >= this are collapsed to the earlier
    # vocabulary entry.
    cross_class_iou: 0.8

    # ── Topics (absolute: the YOLO node's resolved names, so the
    #    downstream chain and RViz need zero changes) ─────────
    image_topic:        "/camera/image_raw"
    odom_topic:         "/odom"
    detections_topic:   "/detector_node/detections"
    debug_image_topic:  "/detector_node/debug_image"

    # ── Debug ──────────────────────────────────────────────
    publish_debug_image: true
    jpeg_quality: 85
    queue_size: 5
    # One [la_stats] summary line per this many seconds (0 disables).
    stats_interval_sec: 10.0
