# ROS 2 Humble / Gazebo Classic sim stack + LocateAnything-3B grounding
# service.
#
# Requires an NVIDIA GPU + the NVIDIA Container Toolkit on the host.
# Every compose command takes BOTH files, in this order, from the
# repository root:
#
#   docker compose -f docker/compose.yaml -f docker/compose.local.yaml up -d
#   docker compose -f docker/compose.yaml -f docker/compose.local.yaml exec sim bash
#
# compose.local.yaml carries the host-specific bits (X11 auth, NVIDIA EGL
# vendor JSON); without it Gazebo falls back to llvmpipe software
# rendering and gzclient cannot open a window.

# Project name: images are built as tb3-semantic-nav-sim and
# tb3-semantic-nav-grounding, volumes are prefixed tb3-semantic-nav_.
# Override with `docker compose -p <name>` (or COMPOSE_PROJECT_NAME) to
# run a second, fully separate copy.
name: tb3-semantic-nav

services:
  sim:
    build:
      context: .
      dockerfile: Dockerfile.sim
    ports:
      # Published by sim (not grounding) so the grounding container can
      # join with network_mode: "service:sim" and in-container nodes reach
      # it at 127.0.0.1:8801. Loopback-only on the host.
      - "127.0.0.1:8801:8801"
    volumes:
      - ..:/home/ubuntu/ws
      # Colcon artifacts stay off the bind mount, in named volumes.
      - ws_build:/home/ubuntu/ws/build
      - ws_install:/home/ubuntu/ws/install
      - ws_log:/home/ubuntu/ws/log
      # Best-view frames written by the perception chain.
      - evidence:/home/ubuntu/.tb3_semantic_nav
      # X11 socket for gzclient/RViz on the host display.
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # gzclient window geometry, kept in the repo so it survives container
      # recreation. Mounted rw: gzclient rewrites it on exit, which is how
      # adjusted geometry persists — an unwanted diff is a plain
      # `git checkout` away.
      - ./gazebo_gui.ini:/home/ubuntu/.gazebo/gui.ini
    shm_size: "2gb"
    environment:
      - TURTLEBOT3_MODEL=waffle_pi
      - DISPLAY=${DISPLAY:-:0}
      # Avoid MIT-SHM across the container boundary (X clients sharing
      # only the socket, not shared memory, misrender without this).
      - QT_X11_NO_MITSHM=1
    # Idle until exec'd into; the ROS stack is started explicitly with
    # `docker compose exec sim ros2 launch …`.
    command: ["sleep", "infinity"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              # `gpu` is the coarse capability compose understands; the
              # graphics/display caps that GLX rendering needs come from
              # NVIDIA_DRIVER_CAPABILITIES=all set in the image. Both are
              # required.
              capabilities: [gpu]

  grounding:
    build:
      context: .
      dockerfile: Dockerfile.grounding
    # Shares sim's netns: in-container ROS nodes reach the server at
    # 127.0.0.1:8801, and the host does too because sim publishes the
    # port loopback-only above.
    network_mode: "service:sim"
    volumes:
      - ../grounding:/app
      # LocateAnything-3B weights (~7.7 GB), downloaded from Hugging Face
      # on the first start and reused from this volume afterwards.
      - hf_cache:/hf-cache
    environment:
      # Set to `mock` to fall back to the GPU-free HSV colour heuristic.
      - GROUNDING_BACKEND=${GROUNDING_BACKEND:-locate_anything}
      # 0 = allowed to download the weights (needed on the first start).
      # Once they are in hf_cache, HF_HUB_OFFLINE=1 skips the online check
      # and starts faster; the model revision is pinned in
      # backends/locate_anything.py either way.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      # Deterministic detection. Greedy = argmax with the model card's
      # T/top_p sharpening kept (temperature 0 breaks this checkpoint's
      # MTP decoder — see backends/locate_anything.py). la_detector_node
      # sends its own per-request options anyway; these are the defaults
      # for probes and /ground.
      - GROUNDING_SAMPLING=greedy
      - GROUNDING_GENERATION_MODE=fast
      # The container runs as root and /app is the bind-mounted checkout:
      # without this, root-owned __pycache__ dirs end up in grounding/.
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      - sim
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ws_build:
  ws_install:
  ws_log:
  evidence:
  hf_cache:
