# ============================================================
# tb3_coordinator — coordinator_node + semantic_map_memory_node
# ============================================================

coordinator_node:
  ros__parameters:
    user_command_topic:       "/user_command"
    exploration_enabled_topic: "/exploration_enabled"
    query_command_topic:      "/semantic_query_node/command"
    query_result_topic:       "/semantic_query_node/selected_target"
    goal_pose_topic:          "/nav_goal_adapter_node/goal_pose"
    status_topic:             "~/status"
    navigate_to_pose_action:  "navigate_to_pose"
    nav_goal_timeout_sec:     60.0
    auto_resume_exploration:  true
    # R04 demo shape: after TARGET_REACHED / TARGET NOT FOUND go to IDLE
    # and hold position (exploration off, zero cmd_vel) until the next
    # user command. Takes precedence over auto_resume_exploration; set
    # false to restore the pre-R04 auto-resume behavior.
    hold_after_goal:          true
    resume_delay_sec:         3.0

    # ── Search link (Phase 2c) ─────────────────────────────────
    # Latched topics wiring SEARCHING mode: the injected expression
    # (consumed by la_detector_node + semantic_map_memory_node), the
    # landmark stream watched for the promoted search class, and
    # goal_assignment_node's exploration-complete signal that triggers
    # the explicit NOT FOUND.
    active_search_topic:        "/active_search"
    landmark_topic:             "/semantic_map_memory_node/landmark_objects"
    exploration_complete_topic: "/exploration_complete"
    odom_topic:                 "/odom"
    # If exploration was ALREADY complete when the search starts, wait
    # this long before declaring NOT FOUND (lets the detector see the
    # target from the current pose).
    search_grace_sec:           15.0
    # ── Search patrol (R05) ────────────────────────────────────
    # "Exploration complete" means the MAP is complete, not that the
    # robot has LOOKED at everything: frontier goals face outward, so
    # interior objects are only ever seen in passing. Measured (R05
    # A1/A2): after exploration finished (~400 s) every later search
    # died at the grace window standing still — the green-shirt
    # candidate sat at n=4/5, 0.05 m from the true person, and expired;
    # 'go to the bookshelf' gave up after 15 s. Patrol instead: drive to
    # a waypoint and turn on the spot there (sweep_angular_vel 0.4 is
    # below the detector's 0.5 spin gate, so the frames still count),
    # one round per waypoint, NOT FOUND only after the budget is spent.
    # Disable with search_patrol_enabled:=false to get the R04 behavior.
    search_patrol_enabled:      true
    search_patrol_rounds:       4
    search_patrol_sweep_sec:    14.0
    search_patrol_goal_timeout_sec: 60.0
    # Interior quadrant centres of the 6x6 m room: close enough to every
    # object for a sweep to see it inside the 2.5 m memory range gate,
    # far enough from the walls to stay reachable.
    search_patrol_points:       ["1.2:1.2", "-1.2:1.2", "-1.2:-1.2", "1.2:-1.2"]
    # Preemption safety net: dispatch the queued command even if the
    # cancelled goal's terminal result never arrives.
    preempt_watchdog_sec:       5.0

    # ── Perception sweep (disabled by default) ─────────────────
    # The 360° in-place sweep was originally meant to "kick-start" SLAM by
    # exposing the surrounding semantics, but in practice spinning in place
    # provides almost no SLAM benefit (the laser only sees what is already in
    # line of sight from the current pose) while costing ~18 s and stressing
    # the TF cache (we observed `Message Filter dropping message` during sweeps).
    #
    # The replacement bootstrap strategy now lives in goal_assignment_node:
    # when exploration is enabled but no valid frontier exists, that node
    # picks a low-cost point in the global costmap around the robot and
    # sends it to Nav2. This actually moves the robot, which actually
    # grows the map.
    #
    # Flip this back to `true` to restore the legacy spin behavior.
    enable_perception_sweep:  false

semantic_map_memory_node:
  ros__parameters:
    input_topic:              "/semantic_memory_node/objects"
    output_topic:             "/semantic_memory_markers"
    map_topic:                "/map"
    target_frame:             "map"
    tf_timeout:               0.3
    publish_rate:             1.0

    # ── Landmark matching ──────────────────────────────────
    # Tolerance for "this observation belongs to an existing landmark".
    # Bumped 0.8 → 1.5 m because in practice a single physical person is
    # observed from many viewpoints and the projected (x, y) wanders by
    # 0.3–0.5 m due to:
    #   * YOLO bbox center ≠ the LiDAR centroid of the person's legs
    #     (bbox includes arms / clothing → ±0.15 m offset).
    #   * LDS-01 returns at ankle height bounce off either leg
    #     depending on angle → ±0.1 m range jitter.
    #   * SLAM map→odom drift in feature-poor middle of the warehouse
    #     (LDS-01 range 3.5 m vs 6×10 m room) adds another ±0.3 m.
    #   * Bot impacts on a `<static>` person model can't move the
    #     person but momentarily pitch the chassis — pitched LDS rays
    #     hit the floor, which SLAM rasterizes as fake obstacles, so
    #     subsequent "snap to nearest island" can pull the projection
    #     onto a phantom obstacle a meter away from the real person.
    # 1.5 m is well below the inter-person spacing in the
    # `warehouse_models_person` world (corner ↔ centre = 4.47 m), so
    # legitimately separate persons will not be merged.
    merge_distance:           1.5
    candidate_merge_distance: 1.5

    # ── Promotion ──────────────────────────────────────────
    # Generic fallback (any class without a class-specific override
    # below uses this). Raised 3 → 8 in Phase 2b for the same reason
    # person went 3 → 8 in the course repo: with the LocateAnything
    # vocabulary the fallback governs the open-vocabulary classes
    # (bookshelf / trash can / traffic cone), and at 3 a run-1 ghost
    # ("traffic cone_3", 3 stray mislocalized observations) became a
    # permanent landmark that "go to the cone" then navigated to. Real
    # objects accumulate n=15+ within one exploration pass, so 8 costs
    # only promotion latency. The YOLO path is unaffected: person /
    # bench / stop sign all have explicit overrides below.
    min_observations:         8

    # ── Obstacle island search ─────────────────────────────
    # Search window radius in grid cells around the observation.
    search_radius_cells:      20

    # Minimum occupancy value (0-100) to consider a cell as obstacle.
    occupied_threshold:       50

    # Minimum connected pixels for a valid island (1 = accept single pixels).
    min_island_pixels:        2

    # ── Candidate lifecycle ────────────────────────────────
    # Seconds before an unconfirmed candidate is discarded.
    candidate_timeout:        45.0

    # ── Observation quality ───────────────────────────
    # Reject observations farther than this from robot (in base_link).
    # Reduces landmark drift from noisy far-distance localizer output.
    max_observation_range_m:   2.5

    # ── Class-aware gating ────────────────────────────
    person_max_range_m:        2.5
    bench_max_range_m:         2.0
    stop_sign_max_range_m:     1.8
    # Promotion threshold for `person` candidates. Bumped 3 → 8 to
    # filter out ghost landmarks created by transient mis-projections
    # near a real person (typical symptom: a `person_N` with n=4 or
    # n=5 sitting 0.5–1 m next to a high-confidence `person_M` with
    # n=50+). Real persons in `warehouse_models_person` accumulate
    # n ≥ 19 once the bot finishes exploring, so 8 is well below the
    # natural support of every legitimate landmark.
    person_min_observations:   8
    bench_min_observations:    4
    stop_sign_min_observations: 5

    # ── Search link (Phase 2c) ─────────────────────────
    # Promotion threshold for the class named on /active_search while
    # the search is active. Between the generic fallback (8, ghost
    # filter) and the pre-R02b default (3): a searched class is
    # confirmed downstream by the coordinator before any goal is sent,
    # and exploration may give the object only one viewing pass — R02b
    # §5.1 measured sparse-view candidates expiring at 7/8. 5 still
    # rejects the run-1 ghost pattern (3 stray observations).
    # R05: 5 -> 3, and it now applies ONLY to searched classes outside
    # the base vocabulary (open-vocabulary expressions). Those are the
    # recall-bound ones: the low camera shows a colored shirt in ~10% of
    # frames (R05 probe: 6/60 frames carry a green-expression box, all
    # correct), and after the range/edge/height gates a 13-minute search
    # reached only 26 observations — never 5. At 3 the same search
    # promoted at 0.15 m from the true person. The R04 rationale for 5
    # (filter the 3-stray-observation ghost pattern) is now carried by
    # the localizer height gate, the detector containment veto and the
    # same-family exemption. Searched classes that ARE in the base
    # vocabulary keep their normal threshold — they are observed
    # continuously, and at 3 a bookshelf search promoted a ghost on the
    # blue-shirt person while the real shelf reached n=8 (R05 B1).
    search_min_observations:   3
    # Candidate expiry for the ACTIVE search class only. The generic
    # candidate_timeout (45 s) assumes the mapping path's steady stream;
    # a searched class is seen only when exploration happens to face it
    # (drive-by bursts). R04 smoke 2 measured the true green-shirt
    # candidate expiring at n=4/5, age exactly 45 s, twice in one
    # search. 150 s bridges the gap between two exploration passes
    # while still letting stray mislabel clusters die between searches.
    search_candidate_timeout:  150.0
    active_search_topic:       "/active_search"
    # Close-range forced-choice guard: observations of the active
    # search class below this range are rejected. Measured R02c run A:
    # parked 0.5 m from the bookshelf during a cone search, the shelf
    # close-up was boxed "traffic cone" 74x in 89 s and hijacked the
    # search. Legitimate promotions happen at 1-2.5 m.
    search_min_range_m:        0.9
    # A landmark whose class is not currently observable (base
    # vocabulary or active search label) cannot be relabeled away —
    # its count is frozen, so challenger counts are one-sided
    # evidence. Measured R02c run A: bookshelf_0 flipped to person 61 s
    # after its search cleared.
    # R05: the default detector profile maps all five registry classes,
    # so all five are permanently observable (their counts keep moving
    # and relabel evidence against them is two-sided again).
    observable_classes:        ["person", "bookshelf", "trash can",
                                "traffic cone", "concrete barrier"]
    # Per-class merge radius, "label:metres" — overrides candidate AND
    # landmark merge for that class, including during its search. The
    # jersey barrier is 4.07 m long and its true observations scatter
    # along the body wherever each ray lands; under the 0.6 m search
    # radius they split into candidates that never reach n=5 (R05 A1:
    # 70 s barrier search, zero promotions → NOT FOUND). 2.2 m spans
    # half the barrier plus slop.
    class_merge_overrides:     ["concrete barrier:2.2"]
    wall_boundary_margin_m:   0.20

    # ── Landmark relabelling ───────────────────────────────
    # A landmark used to be stuck with whatever label promoted it. The
    # cross-class mutex then discarded every disagreeing observation that
    # landed on it, so a landmark promoted under the wrong label actively
    # suppressed the evidence that would have corrected it: measured
    # 2026-09-05, a `trash_can_1` sitting on the chair rejected 86 `chair`
    # observations and `go to chair` could not succeed until the run was
    # restarted.
    #
    # Now every landmark keeps a per-label observation count, disagreeing
    # observations inside the merge radius are counted instead of dropped,
    # and the label switches when a challenger is clearly ahead. Position is
    # still averaged over observations of the current label only.
    relabel_enabled:           true
    # How far ahead the challenger has to be: challenger >= ratio x current,
    # AND the challenger must also have reached its own min_observations
    # (12 for chair / trash_can, 8 for person) so a few strays cannot rename
    # anything. 1.5 is the hysteresis band. Because the losing label keeps
    # its count, flipping back needs 1.5x the NEW count, so a correction
    # settles instead of oscillating. Equal counts never relabel.
    relabel_ratio:             1.5
    # How close a disagreeing observation has to be to count as evidence.
    # Kept at the cross-class mutex distance ON PURPOSE, not at
    # merge_distance: this is exactly the set of observations the old code
    # already discarded, so counting them costs the candidate layer nothing.
    # Measured at 1.5 m over 8 acceptance runs it starved candidates instead
    # - one run absorbed 53 chair observations while the chair candidate saw
    # 2, and the chair was never promoted. Raise it only together with a
    # fresh acceptance batch.
    relabel_evidence_distance_m: 0.6

    # ── Gate statistics (observability only) ──────────────
    # Every rejection gate in the observation pipeline (range, TF, grid
    # bounds, no occupancy island, geometry, mutex) and every success path
    # (landmark merge, candidate merge, new candidate, promotion) is counted
    # per class. One `[gate_summary]` block is logged every this many
    # seconds when a counter changed, plus a final block at shutdown, so a
    # log can say which gate held a target back and by how much. The
    # counters are never consulted by the promotion logic. 0 disables the
    # periodic block (the final one is still printed).
    gate_summary_interval_sec: 10.0

    # ── Visualization ──────────────────────────────────────
    sphere_radius:            0.18
    text_offset_z:            0.45
